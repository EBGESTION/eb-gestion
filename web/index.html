 modalRoot.innerHTML=`<div class="modal"><div class="card"><h3>Nueva solicitud</h3><p class="muted">Puedes comenzar vacía, repetir tu último pedido o cargar una plantilla.</p><div class="request-start"><button class="btn" onclick="clearRequestRows()">🆕 Solicitud vacía</button><button class="btn orange" onclick="loadLastRequest()">📋 Repetir última solicitud</button><button class="btn" onclick="showRequestTemplates()">⭐ Plantillas (<span id="templateCount">0</span>)</button></div><div id="templateArea"></div><div class="request-start" style="margin-bottom:8px"><button class="btn" onclick="addItem()">+ Agregar producto</button><button class="btn" onclick="saveCurrentAsTemplate()">⭐ Guardar como plantilla</button></div><div id="itemRows"></div><label>Observación opcional</label><textarea id="reqNote" class="input" rows="4"></textarea><div class="actions"><button class="btn orange" onclick="sendRequest(this)">Enviar solicitud</button><button class="btn" onclick="closeModal()">Cancelar</button></div></div></div>`;
 window.itemRows=document.getElementById('itemRows');
 window.reqNote=document.getElementById('reqNote');
 window.templateArea=document.getElementById('templateArea');
 const count=document.getElementById('templateCount');if(count)count.textContent=String(getRequestTemplates().length);
 addItem();
}
function clearRequestRows(){if(!window.itemRows)window.itemRows=document.getElementById('itemRows');itemRows.innerHTML='';addItem()}
function addItem(item){let d=document.createElement('div');d.className='request-item';d.innerHTML=`<div class="product-picker"><input class="input prodSearch" autocomplete="off" placeholder="Escribe para buscar producto..." value="${esc(item?.name||'')}" onfocus="showProductResults(this)" oninput="showProductResults(this)"><input class="prodSel" type="hidden" value="${item?.productId||''}"><div class="product-results hidden"></div></div><input class="input qty" type="number" min="0.01" step="0.01" value="${item?.qty||1}"><button class="btn red" onclick="this.parentElement.remove()">×</button>`;itemRows.appendChild(d);if(!item){setTimeout(()=>d.querySelector('.prodSearch').focus(),0)}}
function showProductResults(input){let q=input.value.toLowerCase().trim(),box=input.parentElement.querySelector('.product-results'),blocked=state.user?.role==='cocina'?'Cocina':state.user?.role==='caja'?'Barra y Caja':'',matches=state.products.filter(p=>p.active!==false&&(!blocked||p.warehouse!==blocked)&&(!q||p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q))).slice(0,12);box.innerHTML=matches.map(p=>`<button type="button" onclick="chooseRequestProduct(this,${p.id})">${esc(p.name)} <span class="muted">· ${esc(p.category)} · ${esc(p.warehouse)}</span></button>`).join('')||'<div class="muted" style="padding:10px">Sin coincidencias</div>';box.classList.remove('hidden')}
function chooseRequestProduct(btn,id){let picker=btn.closest('.product-picker'),p=state.products.find(x=>x.id===id);picker.querySelector('.prodSel').value=id;picker.querySelector('.prodSearch').value=p.name;picker.querySelector('.product-results').classList.add('hidden');picker.closest('.request-item').querySelector('.qty').focus();picker.closest('.request-item').querySelector('.qty').select()}
document.addEventListener('click',e=>{if(!e.target.closest('.product-picker'))document.querySelectorAll('.product-results').forEach(x=>x.classList.add('hidden'))})
function loadLastRequest(){let r=[...state.requests].sort((a,b)=>Number(b.id||0)-Number(a.id||0))[0];if(!r)return;itemRows.innerHTML='';r.items.forEach(i=>addItem({productId:i.productId,name:i.name,qty:i.requestedQty}));reqNote.value=r.note||''}
function currentRequestItems(){return [...document.querySelectorAll('.request-item')].map(r=>({productId:Number(r.querySelector('.prodSel').value),name:r.querySelector('.prodSearch').value,qty:Number(r.querySelector('.qty').value)})).filter(x=>x.productId&&x.qty>0)}
function saveCurrentAsTemplate(){let items=currentRequestItems();if(!items.length){alert('Agrega al menos un producto válido');return}let name=prompt('Nombre de la plantilla, por ejemplo: Pedido habitual cocina');if(!name?.trim())return;let ts=getRequestTemplates();ts.push({id:Date.now(),name:name.trim(),items});localStorage.setItem(requestTemplateKey(),JSON.stringify(ts));showRequestTemplates();alert('Plantilla guardada en este dispositivo')}
function showRequestTemplates(){let ts=getRequestTemplates();templateArea.innerHTML=ts.length?`<div class="template-list">${ts.map(t=>`<div class="template-card"><div><b>${esc(t.name)}</b><div class="muted">${t.items.length} productos</div></div><div><button class="btn orange" onclick="loadRequestTemplate(${t.id})">Cargar</button> <button class="btn red" onclick="deleteRequestTemplate(${t.id})">×</button></div></div>`).join('')}</div>`:'<div class="muted" style="margin:8px 0">Todavía no hay plantillas guardadas.</div>'}
function loadRequestTemplate(id){let t=getRequestTemplates().find(x=>x.id===id);if(!t)return;itemRows.innerHTML='';t.items.forEach(i=>addItem(i))}
function deleteRequestTemplate(id){let ts=getRequestTemplates().filter(x=>x.id!==id);localStorage.setItem(requestTemplateKey(),JSON.stringify(ts));showRequestTemplates()}
async function sendRequest(btn){if(btn)btn.disabled=true;try{let items=currentRequestItems().map(x=>({productId:x.productId,qty:x.qty}));if(!items.length)throw new Error('Agrega al menos un producto válido');let out=await api('/api/requests',{method:'POST',body:JSON.stringify({items,note:reqNote.value})});closeModal();alert(`Solicitud #${out.id} enviada correctamente`);await refreshAllStable();showPage('requests')}catch(e){alert(e.message)}finally{if(btn)btn.disabled=false}}
function closeModal(){modalRoot.innerHTML=''}
async function prepare(id){await api('/api/requests/'+id+'/prepare',{method:'POST',body:JSON.stringify({username:state.user.username})});await refreshAll()}
function requestAutoDestination(r){return r.area==='Cocina'?'Cocina':r.area==='Caja'?'Barra y Caja':''}
function openDeliver(id){let r=state.requests.find(x=>x.id===id),auto=requestAutoDestination(r),dest=auto||r.destinationWarehouse||'';modalRoot.innerHTML=`<div class="modal"><div class="card"><h3>Entregar solicitud #${id}</h3><div class="section-box" style="margin-bottom:12px"><b>Traspaso interno de bodega</b><div class="muted" style="margin:5px 0 9px">La entrega descuenta de la bodega origen y suma a la bodega destino; no desaparece del inventario general.</div><label>Bodega destino</label><select id="requestDestination" class="input" ${auto?'disabled':''}><option value="">Seleccionar destino</option>${warehouses.map(w=>`<option ${w===dest?'selected':''}>${w}</option>`).join('')}</select>${auto?`<div class="muted" style="margin-top:5px">Destino automático según área: ${auto}</div>`:''}</div>${r.items.map(i=>{let p=state.products.find(x=>x.id===i.productId),stock=p?warehouseStock(p,p.warehouse):Number(i.stock||0);return `<div class="row" style="margin-bottom:12px"><div><b>${i.name}</b><div class="muted">Origen: ${esc(p?.warehouse||'—')} · Solicitado: ${i.requestedQty} ${i.unit} · Disponible: ${stock}</div></div><div><input class="input deliverQty" data-id="${i.id}" data-requested="${i.requestedQty}" type="number" min="0" max="${stock}" step="0.01" value="${Math.min(i.requestedQty,stock)}"><select class="input reason"><option value="">Motivo si entrega menos</option><option>Stock insuficiente</option><option>Ajuste de bodega</option><option>Producto reservado</option><option>Producto dañado</option><option>Otro</option></select></div></div>`}).join('')}<div class="actions"><button class="btn green" onclick="deliver(${id},this)">Finalizar traspaso</button><button class="btn" onclick="closeModal()">Cancelar</button></div></div></div>`}
async function deliver(id,btn){if(btn)btn.disabled=true;try{let items=[...document.querySelectorAll('.deliverQty')].map(el=>({itemId:Number(el.dataset.id),deliveredQty:Number(el.value),reason:el.parentElement.querySelector('.reason').value})),destinationWarehouse=document.getElementById('requestDestination')?.value||'';let out=await api('/api/requests/'+id+'/deliver',{method:'POST',body:JSON.stringify({destinationWarehouse,items})});closeModal();alert(out.alreadyProcessed?'La solicitud ya estaba procesada. No se duplicó ningún movimiento.':'Entrega registrada como traspaso interno y stock actualizado');await refreshAllStable();showPage('requests')}catch(e){alert(e.message)}finally{if(btn)btn.disabled=false}}

</script>
</body>
</html>
